name: IndexNow Submission

on:
  push:
    branches:
      - main
    paths:
      - 'src/**/*.md'

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Submit URLs to Bing IndexNow API
        run: python scripts/submit-indexnow.py
