name: Link Check

on:
  push:
    paths:
      - 'src/**/*.md'
  pull_request:
    paths:
      - 'src/**/*.md'

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run link audit
        run: python scripts/check-links.py
