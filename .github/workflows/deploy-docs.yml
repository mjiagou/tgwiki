
name: 部署文档

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 如果你文档需要 Git 子模块，取消注释下一行
          # submodules: true

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.6.0


      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          corepack: true

      - name: 安装依赖
        run: |
          corepack enable
          corepack prepare pnpm@9.6.0 --activate
          pnpm install --frozen-lockfile

      - name: 构建文档
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: |-
          pnpm run docs:build
          > src/.vuepress/dist/.nojekyll

      - name: 部署文档
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # 部署文档
          branch: gh-pages
          folder: src/.vuepress/dist

  # 部署完成后，从 GitHub 的 IP 向 Bing/IndexNow 提交全站 URL，实现秒级收录
  # （本地/沙箱出口 IP 常被 Bing 拦截，故挂在部署流程内、随站点上线后执行）
  indexnow:
    needs: deploy-gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 等待 CDN 传播 key 文件
        run: sleep 90

      - name: 提交 IndexNow（通知 Bing 秒级收录）
        continue-on-error: true
        run: python3 scripts/submit-indexnow.py
